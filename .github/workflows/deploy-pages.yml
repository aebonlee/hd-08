# ============================================================
# hd-08 회원가입 페이지 → GitHub Pages
#
# 이 파일은 반드시 .github/workflows/ 아래에 있어야 한다.
# 리포 루트에 두면 Actions가 아예 읽지 않아 워크플로가 한 번도 돌지 않는다.
# (2026-08-12 이전까지 실제로 그 상태였다)
# ============================================================
name: Deploy membership page to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p _site
          cp index.html _site/index.html
          # OG 이미지는 리포 루트에 둔다. Pages 소스가 main 루트(legacy)로
          # 되돌아가도 /hd-08/og-image.png 경로가 그대로 유지되기 때문이다.
          cp og-image.png _site/og-image.png

          # 변수가 없어도 배포를 막지 않는다.
          # index.html에 Supabase URL/키 fallback이 하드코딩돼 있어
          # 치환이 없어도 페이지는 정상 동작한다. 변수 미등록 하나로
          # 배포 전체를 죽이면 사이트가 옛 내용에 묶인다.
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_PUBLISHABLE_KEY}" ]; then
            echo "::warning::Repository variable SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY 미등록 — index.html의 fallback 값으로 배포합니다."
          else
            python3 - <<'PY'
          from pathlib import Path
          import os

          path = Path("_site/index.html")
          text = path.read_text(encoding="utf-8")
          text = text.replace("__SUPABASE_URL__", os.environ["SUPABASE_URL"])
          text = text.replace("__SUPABASE_PUBLISHABLE_KEY__", os.environ["SUPABASE_PUBLISHABLE_KEY"])
          path.write_text(text, encoding="utf-8")
          print("Supabase 값 주입 완료")
          PY
          fi

          # 브라우저에 나가면 안 되는 키가 섞였는지 마지막으로 본다.
          # publishable 키만 허용한다. secret/service_role 키는 즉시 실패.
          if grep -qE 'sb_secret_|service_role|SUPABASE_SERVICE' _site/index.html; then
            echo "::error::_site/index.html에 비밀 키로 보이는 문자열이 있습니다. 배포를 중단합니다."
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
