name: Deploy membership page to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL}" || (echo "Repository variable SUPABASE_URL is missing" && exit 1)
          test -n "${SUPABASE_PUBLISHABLE_KEY}" || (echo "Repository variable SUPABASE_PUBLISHABLE_KEY is missing" && exit 1)

          mkdir -p _site
          cp index.html _site/index.html

          python3 - <<'PY'
          from pathlib import Path
          import os

          path = Path("_site/index.html")
          text = path.read_text(encoding="utf-8")
          text = text.replace("__SUPABASE_URL__", os.environ["SUPABASE_URL"])
          text = text.replace("__SUPABASE_PUBLISHABLE_KEY__", os.environ["SUPABASE_PUBLISHABLE_KEY"])
          path.write_text(text, encoding="utf-8")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
